[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DmV554/alma-gantt"
publish = false

[workspace.dependencies]
alma-core = { path = "crates/alma-core" }
alma-sched = { path = "crates/alma-sched" }
alma-format = { path = "crates/alma-format" }
alma-ops = { path = "crates/alma-ops" }
alma-layout = { path = "crates/alma-layout" }
alma-export = { path = "crates/alma-export" }
alma-mcp = { path = "crates/alma-mcp" }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
toml_edit = "=0.25.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.12.0"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt"] }
base64 = "=0.23.1"
resvg = { version = "=0.49.0", default-features = false, features = ["text", "system-fonts"] }
rust_xlsxwriter = { version = "=0.102.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
